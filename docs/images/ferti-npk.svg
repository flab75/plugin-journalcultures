<path d="M60,62 L230,62 L234,78 L56,78 Z" fill="url(#h3)" stroke="#2b2118" stroke-width="0.8"/>
<path d="M60,62 L230,62 L234,78 Q244,190 236,300 L54,300 Q46,190 56,78 Z" fill="none" stroke="#2b2118" stroke-width="1.2"/>
<path d="M66,84 Q60,190 64,292 M226,84 Q232,190 228,292" fill="none" stroke="#2b2118" stroke-width="0.4"/>
<rect x="76" y="100" width="138" height="170" fill="#f4ecd8" stroke="#2b2118" stroke-width="0.8"/>
<text x="145" y="122" font-size="12" text-anchor="middle" letter-spacing="2">ENGRAIS</text>
<text x="145" y="137" font-size="9.5" text-anchor="middle" font-style="italic">pour agrumes en pot</text>
<path d="M145,146 q-14,12 0,30 q14,-18 0,-30 Z" fill="#6e8f3c" opacity="0.75" filter="url(#aqua)"/><path d="M145,146 q-14,12 0,30 q14,-18 0,-30 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><path d="M145,147 L145,182" stroke="#2b2118" stroke-width="0.6"/>
<path d="M103,232 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="#6e8f3c" opacity="0.85" filter="url(#aqua)"/><path d="M103,232 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="none" stroke="#2b2118" stroke-width="0.7"/><text x="103" y="236" font-size="11" text-anchor="middle" font-style="italic">N</text>
<path d="M153,232 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="#e2c54b" opacity="0.85" filter="url(#aqua)"/><path d="M153,232 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="none" stroke="#2b2118" stroke-width="0.7"/><text x="153" y="236" font-size="11" text-anchor="middle" font-style="italic">P</text>
<path d="M195,232 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="#c08a3e" opacity="0.85" filter="url(#aqua)"/><path d="M195,232 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="none" stroke="#2b2118" stroke-width="0.7"/><text x="195" y="236" font-size="11" text-anchor="middle" font-style="italic">K</text>
<text x="145" y="214" font-size="26" text-anchor="middle" font-weight="bold">12 – 6 – 6</text>
<text x="145" y="256" font-size="8.5" text-anchor="middle" font-style="italic" fill="#5a4a3a">dose : g par litre de pot</text>
<path d="M300,84 m-11,0 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0" fill="#6e8f3c" opacity="0.85" filter="url(#aqua)"/><path d="M300,84 m-11,0 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0" fill="none" stroke="#2b2118" stroke-width="0.8"/>
<text x="300" y="89" font-size="14" text-anchor="middle" font-style="italic">N</text>
<text x="320" y="82" font-size="10.5" letter-spacing="0.8">AZOTE</text><text x="320" y="95" font-size="9.5" font-style="italic" fill="#5a4a3a">le premier chiffre : 12 g d'azote pour 100 g d'engrais,</text>
<text x="320" y="107" font-size="9.5" font-style="italic" fill="#5a4a3a">celui sur lequel le plugin calcule le plan</text>
<path d="M300,138 m-11,0 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0" fill="#e2c54b" opacity="0.85" filter="url(#aqua)"/><path d="M300,138 m-11,0 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0" fill="none" stroke="#2b2118" stroke-width="0.8"/>
<text x="300" y="143" font-size="14" text-anchor="middle" font-style="italic">P</text>
<text x="320" y="136" font-size="10.5" letter-spacing="0.8">PHOSPHORE</text><text x="320" y="149" font-size="9.5" font-style="italic" fill="#5a4a3a">le deuxième chiffre</text>
<path d="M300,182 m-11,0 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0" fill="#c08a3e" opacity="0.85" filter="url(#aqua)"/><path d="M300,182 m-11,0 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0" fill="none" stroke="#2b2118" stroke-width="0.8"/>
<text x="300" y="187" font-size="14" text-anchor="middle" font-style="italic">K</text>
<text x="320" y="180" font-size="10.5" letter-spacing="0.8">POTASSIUM</text><text x="320" y="193" font-size="9.5" font-style="italic" fill="#5a4a3a">le troisième chiffre</text>
<line x1="260" y1="232" x2="610" y2="232" stroke="#2b2118" stroke-width="0.4"/>
<text x="290" y="252" font-size="10.5" font-style="italic">Le rapport : diviser par le plus petit chiffre</text>
<text x="290" y="268" font-size="10.5" letter-spacing="0.6">12-6-6</text><path d="M290,320 L290,276.8 L304,276.8 L304,320 Z" fill="#6e8f3c" opacity="0.85" filter="url(#aqua)"/><path d="M290,320 L290,276.8 L304,276.8 L304,320 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><text x="297" y="331" font-size="9" text-anchor="middle" font-style="italic">N</text><path d="M308,320 L308,298.4 L322,298.4 L322,320 Z" fill="#e2c54b" opacity="0.85" filter="url(#aqua)"/><path d="M308,320 L308,298.4 L322,298.4 L322,320 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><text x="315" y="331" font-size="9" text-anchor="middle" font-style="italic">P</text><path d="M326,320 L326,298.4 L340,298.4 L340,320 Z" fill="#c08a3e" opacity="0.85" filter="url(#aqua)"/><path d="M326,320 L326,298.4 L340,298.4 L340,320 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><text x="333" y="331" font-size="9" text-anchor="middle" font-style="italic">K</text><line x1="286" y1="320" x2="346" y2="320" stroke="#2b2118" stroke-width="0.8"/><text x="352" y="298" font-size="10" >÷ 6 = 2-1-1</text><text x="352" y="312" font-size="9.5" font-style="italic" fill="#5a4a3a">conseillé</text>
<text x="452" y="268" font-size="10.5" letter-spacing="0.6">7-3-10</text><path d="M452,320 L452,294.8 L466,294.8 L466,320 Z" fill="#6e8f3c" opacity="0.85" filter="url(#aqua)"/><path d="M452,320 L452,294.8 L466,294.8 L466,320 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><text x="459" y="331" font-size="9" text-anchor="middle" font-style="italic">N</text><path d="M470,320 L470,309.2 L484,309.2 L484,320 Z" fill="#e2c54b" opacity="0.85" filter="url(#aqua)"/><path d="M470,320 L470,309.2 L484,309.2 L484,320 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><text x="477" y="331" font-size="9" text-anchor="middle" font-style="italic">P</text><path d="M488,320 L488,284.0 L502,284.0 L502,320 Z" fill="#c08a3e" opacity="0.85" filter="url(#aqua)"/><path d="M488,320 L488,284.0 L502,284.0 L502,320 Z" fill="url(#h1)" stroke="#2b2118" stroke-width="0.7"/><text x="495" y="331" font-size="9" text-anchor="middle" font-style="italic">K</text><line x1="448" y1="320" x2="508" y2="320" stroke="#2b2118" stroke-width="0.8"/><text x="514" y="298" font-size="10" >÷ 3 = 2,3-1-3,3</text><text x="514" y="312" font-size="9.5" font-style="italic" fill="#5a4a3a">plus de K que de N</text>
<text x="145" y="322" font-size="10.5" text-anchor="middle" letter-spacing="0.8">L'ÉTIQUETTE</text>
<line x1="40" y1="348" x2="600" y2="348" stroke="#2b2118" stroke-width="0.4"/>
<text x="320" y="364" text-anchor="middle" font-size="9.5" fill="#3a2e22">Les trois chiffres N-P-K sont des pourcentages : 12-6-6 = 12 % d'azote, puis phosphore et potassium. Le plugin calcule</text>
<text x="320" y="376" text-anchor="middle" font-size="9.5" fill="#3a2e22">le plan sur le premier. Conseillé en pot : environ 2-1-1 ou 3-1-1 (12-6-6, 12-4-6). D'après University of Maryland,</text>
<text x="320" y="388" text-anchor="middle" font-size="9.5" fill="#3a2e22">Mississippi State University, Clemson. Sac et marque imaginaires. Dessin pour ce plugin, MIT.</text>
</svg>
