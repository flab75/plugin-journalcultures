<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Suivi d'une greffe : contrôles à J+21 et J+42</title>
  <rect width="640" height="250" rx="8" fill="#fbfaf6"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#222">Suivi d'une greffe : le statut n'avance que sur réponse</text>
  <line x1="40" y1="90" x2="625" y2="90" stroke="#555" stroke-width="2"/>
  <circle cx="60" cy="90" r="7" fill="#555"/>
  <text x="60" y="70" text-anchor="middle" font-weight="bold" fill="#222">J 0</text>
  <text x="60" y="115" text-anchor="middle" fill="#333">greffe</text>
  <text x="60" y="131" text-anchor="middle" fill="#333">« en attente »</text>
  <circle cx="260" cy="90" r="7" fill="#2a6"/>
  <text x="260" y="70" text-anchor="middle" font-weight="bold" fill="#222">J+21</text>
  <text x="260" y="115" text-anchor="middle" fill="#333">œil vert et gonflé ?</text>
  <text x="260" y="131" text-anchor="middle" fill="#333">retirer le lien</text>
  <text x="260" y="147" text-anchor="middle" fill="#173">Oui → « probablement prise »</text>
  <circle cx="460" cy="90" r="7" fill="#2a6"/>
  <text x="460" y="70" text-anchor="middle" font-weight="bold" fill="#222">J+42</text>
  <text x="460" y="115" text-anchor="middle" fill="#333">l'œil a-t-il débourré ?</text>
  <text x="460" y="131" text-anchor="middle" fill="#333">sinon rabattre au-dessus</text>
  <text x="460" y="147" text-anchor="middle" fill="#173">Oui → « reprise »</text>
  <text x="580" y="70" text-anchor="middle" fill="#222">15 mars</text>
  <text x="580" y="115" text-anchor="middle" fill="#333">œil dormant :</text>
  <text x="580" y="131" text-anchor="middle" fill="#333">rabattre,</text>
  <text x="580" y="147" text-anchor="middle" fill="#333">a-t-il débourré ?</text>
  <circle cx="580" cy="90" r="7" fill="#fff" stroke="#246" stroke-width="2"/>
  <text x="20" y="182" fill="#555">À chaque contrôle : <tspan font-weight="bold">Douteux</tspan> = revoir dans 7 jours ;</text>
  <text x="20" y="200" fill="#555"><tspan font-weight="bold">Au printemps</tspan> = œil dormant, contrôle le 15 mars ; <tspan font-weight="bold" fill="#c22">Non, mort</tspan> = « échouée ».</text>
  <text x="20" y="218" fill="#555">Avant la reprise : « trop froid / trop chaud pour souder » hors 21-32 °C (moyenne 24 h, réglable) ;</text>
  <text x="20" y="236" fill="#555">œil dormant : seulement « gel » sous 0 °C.</text>
</svg>
