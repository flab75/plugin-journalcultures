<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Suivi d'une greffe d'œil : contrôles à J+21, J+42 et pousse du greffon</title>
  <rect width="700" height="300" rx="8" fill="#fbfaf6"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#222">Suivi d'une greffe d'œil : le statut n'avance que sur réponse</text>
  <line x1="40" y1="90" x2="680" y2="90" stroke="#555" stroke-width="2"/>
  <circle cx="60" cy="90" r="7" fill="#555"/>
  <text x="60" y="70" text-anchor="middle" font-weight="bold" fill="#222">J 0</text>
  <text x="60" y="115" text-anchor="middle" fill="#333">greffe</text>
  <text x="60" y="131" text-anchor="middle" fill="#333">« en attente »</text>
  <circle cx="210" cy="90" r="7" fill="#2a6"/>
  <text x="210" y="70" text-anchor="middle" font-weight="bold" fill="#222">J+21</text>
  <text x="210" y="115" text-anchor="middle" fill="#333">œil vert et gonflé ?</text>
  <text x="210" y="131" text-anchor="middle" fill="#333">retirer le lien</text>
  <text x="210" y="147" text-anchor="middle" fill="#173">Oui → « probablement prise »</text>
  <circle cx="390" cy="90" r="7" fill="#2a6"/>
  <text x="390" y="70" text-anchor="middle" font-weight="bold" fill="#222">J+42</text>
  <text x="390" y="115" text-anchor="middle" fill="#333">l'œil a-t-il débourré ?</text>
  <text x="390" y="131" text-anchor="middle" fill="#333">sinon le forcer (rabattre au-dessus)</text>
  <text x="390" y="147" text-anchor="middle" fill="#173">Oui → « pousse du greffon »</text>
  <circle cx="580" cy="90" r="7" fill="#2a6"/>
  <text x="580" y="70" text-anchor="middle" font-weight="bold" fill="#222">4 semaines après</text>
  <text x="580" y="115" text-anchor="middle" fill="#333">tuteurer, couper le haut du</text>
  <text x="580" y="131" text-anchor="middle" fill="#333">porte-greffe, ôter les rejets</text>
  <text x="580" y="147" text-anchor="middle" fill="#173">Oui → « réussie »</text>
  <path d="M390 155 V180 H430" fill="none" stroke="#246" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="440" cy="180" r="7" fill="#fff" stroke="#246" stroke-width="2"/>
  <text x="382" y="184" text-anchor="end" fill="#246">Au printemps</text>
  <text x="455" y="176" fill="#333">15 mars : œil dormant, rabattre ;</text>
  <text x="455" y="192" fill="#333">débourré → « pousse du greffon »</text>
  <text x="20" y="226" fill="#555">À chaque contrôle : <tspan font-weight="bold">Douteux</tspan> = revoir dans 7 jours ; <tspan font-weight="bold" fill="#c22">Non, mort</tspan> = « échouée ».</text>
  <text x="20" y="244" fill="#555">« Au printemps » : proposé à J+42 (15 septembre dans l'hémisphère sud).</text>
  <text x="20" y="262" fill="#555">En attente, probablement prise : « trop froid / trop chaud pour souder » hors 21-32 °C (24 h, par défaut) ;</text>
  <text x="20" y="280" fill="#555">œil dormant (soudure considérée faite) et pousse : seulement « gel » sous 0 °C.</text>
</svg>
