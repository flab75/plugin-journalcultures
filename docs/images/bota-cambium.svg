<text x="96" y="340" font-size="17" text-anchor="middle" font-style="italic">A</text><text x="96" y="356" font-size="10.5" text-anchor="middle" letter-spacing="0.6">LA TIGE EN COUPE</text><text x="96" y="369" font-size="9.5" text-anchor="middle" font-style="italic" fill="#5a4a3a">de l'extérieur vers le centre</text>
<text x="343" y="340" font-size="17" text-anchor="middle" font-style="italic">B</text><text x="343" y="356" font-size="10.5" text-anchor="middle" letter-spacing="0.6">LE CAMBIUM</text><text x="343" y="369" font-size="9.5" text-anchor="middle" font-style="italic" fill="#5a4a3a">grossi : ce qu’il fait</text>
<text x="474" y="340" font-size="17" text-anchor="middle" font-style="italic">C</text><text x="474" y="356" font-size="10.5" text-anchor="middle" letter-spacing="0.6">DANS UNE GREFFE</text><text x="474" y="369" font-size="9.5" text-anchor="middle" font-style="italic" fill="#5a4a3a">écusson en chip, vu en coupe</text>
<line x1="40" y1="382" x2="600" y2="382" stroke="#2b2118" stroke-width="0.4"/>
<text x="320" y="397" text-anchor="middle" font-size="9" fill="#3a2e22">A, de l'extérieur vers le centre : l'écorce (liège et liber, tout ce qui est hors du cambium), le cambium, le bois ; l'aubier conduit</text>
<text x="320" y="409" text-anchor="middle" font-size="9" fill="#3a2e22">encore l'eau (OpenStax p. 866 ; Shipunov p. 121 et 123 ; Atkinson 1905 p. 381). Un cerne par saison de pousse : un par an en climat à saisons,</text>
<text x="320" y="421" text-anchor="middle" font-size="9" fill="#3a2e22">pas net sans saisons marquées (OpenStax p. 867-868 ; Shipunov p. 120). B, le cambium fait du bois vers l'intérieur et du liber vers l'extérieur</text>
<text x="320" y="433" text-anchor="middle" font-size="9" fill="#3a2e22">(OpenStax p. 867 ; Shipunov p. 119) ; l'eau monte dans le bois, les sucres vont dans les deux sens dans le liber (OpenStax p. 861, 885 ;</text>
<text x="320" y="445" text-anchor="middle" font-size="9" fill="#3a2e22">Shipunov p. 74, 103). Règle générale des arbres ; agrumes compris (déduction du plugin). C, les cambiums du greffon et du porte-greffe doivent</text>
<text x="320" y="457" text-anchor="middle" font-size="9" fill="#3a2e22">se toucher (Bailey 1907 p. 78 ; Curk 2022 p. 183) ; pour le chip, des deux côtés si possible (UF/IFAS HS1309). Pas à l'échelle. Dessin pour ce plugin, MIT.</text>
</svg>
