<text x="320" y="318" text-anchor="middle" font-size="9.5" fill="#3a2e22">Un apport n'est annoncé que si deux conditions sont réunies : la période d'apport du produit et une moyenne sur 7 jours</text>
<text x="320" y="331" text-anchor="middle" font-size="9.5" fill="#3a2e22">au moins égale au zéro de végétation (≈ 13 °C). La période (ici début mars à début octobre, Île-de-France) se règle pour chaque</text>
<text x="320" y="344" text-anchor="middle" font-size="9.5" fill="#3a2e22">produit selon le climat et l'étiquette ; dans l'hémisphère sud, le plugin la décale de 6 mois. La mesure suit la région : sous le seuil,</text>
<text x="320" y="357" text-anchor="middle" font-size="9.5" fill="#3a2e22">l'apport attend et il est rattrapé dès que la moyenne remonte. A et B : deux produits quelconques, chacun avec son intervalle.</text>
<text x="320" y="370" text-anchor="middle" font-size="9.5" fill="#3a2e22">Courbe d'exemple. D'après Curk 2022 (INRAE), University of Maryland, Asadi Kangarshahi 2023. Dessin pour ce plugin, MIT.</text>
